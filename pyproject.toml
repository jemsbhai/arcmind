[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "arcmind"
version = "0.1.0"
description = "Dual-timescale hybrid SSM+Attention architecture for efficient robotics and IoT language models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Muntaser Syed"},
]
keywords = [
    "deep-learning",
    "state-space-model",
    "mamba",
    "attention",
    "robotics",
    "iot",
    "edge-ai",
    "language-model",
    "sensor-fusion",
    "tiny-ml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.1.0",
    "einops>=0.7.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mamba = [
    "mamba-ssm>=2.0.0",
    "causal-conv1d>=1.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "build>=1.0",
    "twine>=5.0",
]
all = ["arcmind[mamba,dev]"]

[project.urls]
Homepage = "https://github.com/jemsbhai/arcmind"
Repository = "https://github.com/jemsbhai/arcmind"
Issues = "https://github.com/jemsbhai/arcmind/issues"

[tool.setuptools.packages.find]
include = ["arcmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["arcmind"]

[tool.coverage.report]
show_missing = true
fail_under = 80
