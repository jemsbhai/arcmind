[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcmind"
dynamic = ["version"]
description = "Causal dual-rate sequence backbone for streaming sensor policies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.10"
authors = [
    {name = "Muntaser Syed"},
]
keywords = [
    "deep-learning",
    "state-space-model",
    "attention",
    "robotics",
    "iot",
    "edge-ai",
    "sensor-fusion",
    "tiny-ml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
datasets = [
    "minari>=0.5.0",
]
benchmarks = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "build>=1.0",
    "twine>=5.0",
    "pyyaml>=6.0",
]
all = ["arcmind[benchmarks,datasets,dev]"]

[project.urls]
Homepage = "https://github.com/jemsbhai/arcmind"
Repository = "https://github.com/jemsbhai/arcmind"
Issues = "https://github.com/jemsbhai/arcmind/issues"

[tool.setuptools.packages.find]
include = ["arcmind*"]

[tool.setuptools.dynamic]
version = {attr = "arcmind.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: tests that download data or take a long time",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["arcmind"]

[tool.coverage.report]
show_missing = true
fail_under = 80
