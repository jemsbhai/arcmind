protocol_version: 8
status: development
target_venue: ICLR
cloud_budget_usd: 10

principles:
  model_selection:
    delayed_sensor_recall: validation_nll_only
    pomdp: fixed_interaction_budget_no_return_based_checkpoint_selection
    robot_imitation: heldout_demonstration_validation_metric
  test_evaluation: once_after_selection_or_fixed_budget
  paired_data: true
  report_uncertainty: true
  preserve_raw_per_seed_results: true

result_tiers:
  smoke:
    purpose: validate_environment_adapter_shapes_jit_gradients_and_artifacts
    allowed_budget: quick_or_shortened
    allowed_seeds: 1
    paper_status: prohibited
  pilot:
    purpose: debug_learning_and_freeze_architectures_hyperparameters_and_failures
    allowed_budget: may_be_shorter_than_published_reference
    typical_seed_count: 3
    paper_status: development_only
  development_tuning:
    purpose: select_frozen_candidates_by_predeclared_learning_curve_auc
    registration_schema: 3
    budget_rule: use_published_reference_steps_for_pobax
    seed_rule: use_published_task_specific_tuning_count
    comparison_profile: arcmind_shared_comparison
    matrix_kind: hyperparameter_selection
    matrix_rule: one_primary_environment_complete_cartesian_candidate_grid
    selection_scope: within_model_family_only
    paper_status: selection_only_not_performance_evidence
  registered_final:
    purpose: evaluate_frozen_methods_on_paired_seed_manifests
    primary_registration_schema: 4
    upper_reference_registration_schema: 2
    budget_rule: use_published_reference_steps_for_pobax
    target_seed_count: 30
    tuning_seed_overlap: prohibited
    paper_status: eligible_after_all_release_gates_pass

stages:
  local_diagnostic:
    benchmark: delayed_sensor_recall
    purpose: isolate fading-memory and exact-recall contributions
    exact_recall_window: 8
    retained_memory_slots: 16
    train_examples: 4096
    validation_examples: 1024
    test_examples: 2048
    seeds: [1103, 2207, 3301, 4409, 5519]
    models:
      - memoryless_mlp
      - gru
      - lstm
      - causal_transformer
      - arcmind_ssm_only
      - arcmind_unordered
      - arcmind
    selection_metric: nll
    metrics:
      - accuracy
      - nll
      - short_lag_accuracy
      - long_lag_accuracy
      - parameter_count
      - train_seconds
      - inference_examples_per_second

  pomdp_pilot:
    benchmark: POBAX
    implementation: shared_jax_ppo
    result_status: development_only_until_all_adapters_and_hyperparameters_are_frozen
    seeds: [1103, 2207, 3301]
    first_frozen_matrix:
      manifest: benchmarks/pobax/manifests/tmaze_pilot_v1.json
      environment: tmaze_10
      train_steps: 250000
      num_envs: 8
      rollout_steps: 125
      exact_steps_per_update: 1000
      update_epochs: 4
      evaluation_episodes_per_environment: 16
      total_evaluation_episodes_per_seed: 128
    validated_policy_cores:
      - memoryless_mlp
      - frame_stack_mlp
      - memory_trace_mlp
      - positional_mlp
      - elman_rnn
      - gru
      - lstm
      - tcn
      - ffm
      - shm_paper_uniform
      - s4d
      - ms4
      - ms4n
      - lru
      - s5rl
      - causal_transformer
      - transformer_xl
      - gtrxl
      - arcmind
      - arcmind_unordered
      - arcmind_no_memory
      - arcmind_no_ssm
      - arcmind_no_gate
      - arcmind_ssm_only
    remaining_required_adapters: []
    tasks:
      - simple_chain
      - tmaze_10
      - rocksample_11_11
      - battleship_10
      - Walker-V-v0
      - HalfCheetah-V-v0
      - Navix-DMLab-Maze-01-v0
    note: >-
      Simple Chain and quick cells validate infrastructure only. They are
      prohibited as paper accuracy results. HalfCheetah-P-v0 is exposed by the
      library but is not a registered POBAX paper task.

  pomdp_registered:
    benchmark: POBAX
    implementation: shared_jax_ppo
    source: https://rlj.cs.umass.edu/2025/papers/RLJ_RLC_2025_153.pdf
    initial_seed_manifest: [1103, 2207, 3301, 4409, 5519]
    target_final_seed_count: 30
    minimum_seed_count_for_preliminary_tables: 10
    policy_selection: final_policy_after_fixed_interaction_budget
    primary_registration_schema: 4
    upper_reference_registration_schema: 2
    tuning_registration_schema: 3
    comparison_profiles:
      pobax_author_semantics:
        purpose: mirror_pinned_author_ppo_settings_and_step_semantics_in_shared_runner
        exact_author_code_reproduction: false
        interaction_budget_rule: floor_to_complete_vector_rollouts
        learning_rate_schedule: >-
          lr * (1 - floor(opt_step / (num_minibatches * update_epochs)) /
          num_updates)
      arcmind_shared_comparison:
        purpose: compare_all_policy_cores_under_one_shared_ppo_contract
        interaction_budget_rule: require_exact_vector_rollout_divisibility
    required_learner_fields:
      - num_envs
      - rollout_steps
      - update_epochs
      - num_minibatches
      - learning_rate
      - gae_lambda
      - entropy_coefficient
      - anneal_learning_rate
    pilot_screening_seeds: [1103, 2207, 3301]
    registered_tuning_seed_rule: match_published_task_count
    tuning_aggregation:
      evidence_tier: development_tuning
      matrix_kind: hyperparameter_selection
      immutable_identity:
        - model_family
        - implementation_model
        - candidate_id
      candidate_cardinality: equal_across_model_families
      normalized_learner_grid: identical_across_model_families
      candidates_per_family_minimum: 2
      immutable_cell_logs:
        completion_index_path_and_sha256: required
        checksum_inventory_coverage: required
      controlled_structural_learner_fields:
        - num_envs
        - rollout_steps
        - update_epochs
        - num_minibatches
      tunable_learner_fields:
        - learning_rate
        - gae_lambda
        - entropy_coefficient
        - anneal_learning_rate
      primary_metric: mean_seed_auc_mean_return
      selection_scope: within_model_family_only
      architecture_ranking: prohibited
      integration: trapezoid_over_shared_complete_case_suffix
      minimum_shared_finite_points: 2
      checkpoint_selection: prohibited
      registered_final_evidence: prohibited
      paper_performance_claims: prohibited
    final_selection_binding:
      registration_schema: 4
      scope: one_primary_environment
      comparison_profile: arcmind_shared_comparison
      raw_tuning_matrix: canonical_rebuild_required
      tuning_aggregate_bytes: exact_canonical_identity
      aggregate_sha256: required
      source_registration_sha256: required
      source_manifest_sha256: required
      winner_candidate_identity: exact
      winner_learner: exact
      final_seed_overlap_with_tuning: prohibited
      author_semantics_upper_reference_binding: not_required
    artifact_requirements:
      aggregate_output_location: outside_immutable_raw_matrix
      freeze_environment_source_and_reference: true
      freeze_parameter_counts_and_ratio: true
      record_requested_environment_steps: true
      record_realized_environment_steps: true
      finite_optimizer_metrics:
        required:
          - loss
          - actor_loss
          - value_loss
          - entropy
          - approximate_kl
        validate_every_update: true
      validate_final_training_metrics: true
      fail_training_before_evaluation: true
      canonical_cell_log: successful_child_only
      failed_attempt_logs: unique_noncanonical_paths
      failed_partial_artifacts: unique_noncanonical_paths
      parameter_ratio_bounds: [0.9, 1.1]
      upper_reference_link:
        required: true
        ordered_seed_identity: exact
        alias_mapping: exact
        validate_both_raw_checksum_inventories: true
    required_policy_cores:
      - memoryless_mlp
      - positional_mlp
      - frame_stack_mlp
      - gru
      - lstm
      - fast_and_forgetful_memory
      - stable_hadamard_memory_paper_uniform
      - lru
      - s4d
      - s5rl
      - transformer_xl
      - arcmind
      - arcmind_unordered
      - arcmind_no_memory
      - arcmind_no_ssm
      - arcmind_no_gate
    registered_tasks:
      tmaze_10:
        environment_id: tmaze_10
        category: object_uncertainty_and_tracking
        published_train_steps: 1000000
        published_tuning_seed_count: 5
        published_final_seed_count: 30
      rocksample_11_11:
        environment_id: rocksample_11_11
        category: object_uncertainty
        published_train_steps: 5000000
        published_tuning_seed_count: 5
        published_final_seed_count: 30
      battleship_10:
        environment_id: battleship_10
        category: spatial_uncertainty_and_episode_nonstationarity
        published_train_steps: 10000000
        published_tuning_seed_count: 10
        published_final_seed_count: 30
      walker_velocity_only:
        environment_id: Walker-V-v0
        category: moment_features
        published_train_steps: 50000000
        published_tuning_seed_count: 5
        published_final_seed_count: 30
      halfcheetah_velocity_only:
        environment_id: HalfCheetah-V-v0
        category: moment_features
        published_train_steps: 50000000
        published_tuning_seed_count: 5
        published_final_seed_count: 30
      navix_dmlab_maze_01:
        environment_id: Navix-DMLab-Maze-01-v0
        category: spatial_uncertainty_and_episode_nonstationarity
        published_train_steps: 10000000
        published_tuning_seed_count: 5
        published_final_seed_count: 30
    note: >-
      Freeze one equal-cardinality tuning grid on the tuning seeds before
      registered evaluation. Never choose checkpoints or hyperparameters from
      registered-seed evaluation returns. The three development tuning seeds
      above are for pilot screening only. Registered tuning must use the
      published task-specific counts recorded above. A result with fewer than
      30 final seeds must state that it does not match the published POBAX
      final-seed count.

statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  aggregate_metrics: [mean, median, iqm]
  paired_environment_seeds: true
